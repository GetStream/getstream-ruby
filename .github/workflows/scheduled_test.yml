name: Scheduled tests
# The integration lane's home. Advisory: see README.md.
on:
  schedule:
    # 11:00, not 09:00: stream-py and stream-sdk-java both run at 09:00 against the same
    # shared Stream app, and all three mutate app-global settings.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/run_integration.yml
    secrets: inherit

  # A failure here lands on no PR, and GitHub emails it only to whoever last edited the cron.
  report:
    name: Report a red run
    needs: integration
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Daily integration run is red
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Unguarded, a non-2xx would abort the step under `bash -e` and a red run would
          # report nothing at all. Fail toward creating the issue, which is the loud way.
          if ! num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"; then
            echo "::warning::Could not list open issues; creating a new one."
            num=""
          fi
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Still red: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body \
              "The daily \`spec/integration/\` run failed: $RUN_URL

          Integration is advisory, so nothing is blocked by this. It still has to be read: the suite
          runs against a live Stream app shared by five SDK repos, so decide whether this is the app,
          the backend, or this SDK, and close the issue once a daily run is green again."
          fi
