name: CI

# pull_request only. A push trigger alongside it ran the whole suite twice on the same
# SHA, and the duplicate integration legs raced each other against the Stream app
# several SDK repos share. master is covered by release.yml, which runs this same
# reusable workflow as the gate before tagging.
on:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit
